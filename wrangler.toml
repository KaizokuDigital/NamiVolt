name = "namivolt"
main = "src/index.ts"
compatibility_date = "2026-07-24"

[[kv_namespaces]]
binding = "NAMIVOLT_KV"
id = "1ffa74c35dba495b8c6853e3d6e110fb"

[vars]
TRUELAYER_AUTH_BASE_URL = "https://auth.truelayer-sandbox.com"
TRUELAYER_DATA_API_BASE_URL = "https://api.truelayer-sandbox.com"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1